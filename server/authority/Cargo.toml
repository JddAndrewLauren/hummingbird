[package]
name = "hummingbird-authority"
version.workspace = true
edition.workspace = true

[dependencies]
hummingbird-domain = { path = "../domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Real SQLite under the fixture tests — the same statements the Durable
# Object executes, no live credentials, no wasm (dev-only by design; the
# guard test in lib.rs holds the [dependencies] section clean).
[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
