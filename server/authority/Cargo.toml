[package]
name = "hummingbird-authority"
version.workspace = true
edition.workspace = true

[dependencies]
hummingbird-domain = { path = "../domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Token hashing (ADR-0008). Pure Rust: compiles for wasm32 with no bindings.
sha2 = "0.10"

# Real SQLite under the fixture tests — the same statements the Durable
# Object executes, no live credentials, no wasm (dev-only by design; the
# guard test in lib.rs holds the [dependencies] section clean). sha2
# reappears so the rig can precompute token hashes.
[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
