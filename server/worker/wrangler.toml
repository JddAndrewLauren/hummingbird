# The authority API worker (ADR-0008): one Worker, one SQLite-backed
# Durable Object.
#
# ## How `hb.twinion.net/api/*` reaches this worker, and not the shell
#
# ADR-0006/0008 fix the API as *same-origin* with the static shell —
# `connect-src 'self'`, no CORS anywhere, and the authority sends no
# `Access-Control-*` header at all — so the two workers must share one
# hostname. `client/web/wrangler.toml` already claims that hostname as a
# **Custom Domain**, which is hostname-exact and takes no path into account.
#
# The mechanism is a narrower **route in front of it**. Cloudflare permits a
# path-scoped route on the same hostname as another Worker's Custom Domain,
# resolves the more specific pattern first, and treats the Custom Domain
# worker as the *origin* sitting behind it ("a Worker running on a Custom
# Domain is treated as an origin. Any Workers running on routes before your
# Custom Domain can optionally call the Worker registered on your Custom
# Domain by issuing `fetch(request)`" — the documented `api.example.com/auth`
# route in front of the `api.example.com` Custom Domain is this exact shape).
# So `/api/*` is intercepted here and answered here; this worker never calls
# on to the shell, and the shell worker never sees API traffic — the CSP
# header it adds is for documents, and JSON has no use for it.
#
# Why this and not the two alternatives:
#   - **Service binding from `csp-worker`** (the shell fronts the API and
#     forwards `/api/*`): also correct, and it would make the routing
#     testable code rather than platform config — but it puts the static
#     shell in the request path of every API call, so a shell bug or a bad
#     shell deploy takes the authority down with it, and it couples the two
#     deploys in a fixed order forever. Kept as the **flip condition**: if
#     the route-in-front-of-Custom-Domain arrangement misbehaves at H3
#     (symptom: an `/api/...` call answered with 200 `text/html` — the
#     shell's SPA fallback — instead of JSON), move the routing into
#     `csp-worker/worker.ts` behind a `[[services]]` binding and delete the
#     `routes` below.
#   - **A second hostname (`api.twinion.net`) + CORS**: rejected upstream.
#     It contradicts `connect-src 'self'` and would require building the
#     CORS/preflight lane ADR-0008 exists to avoid.
#
# The route needs no DNS record of its own: the shell's Custom Domain
# already creates and proxies `hb.twinion.net`, which is the record this
# pattern matches against. `wrangler dev` ignores `routes` entirely, so
# local dev and `server/scripts/smoke.sh` are unaffected.
#
# **Live since 2026-08-10** (#237/#238), and the arrangement above is
# confirmed in production rather than merely reasoned: with no credential
# `/api/sweep` answers an empty-bodied 401 and with a device token it
# answers `200 application/json`, where a precedence failure would have
# returned the shell's `200 text/html`. The flip below stays documented as
# the response if that ever regresses; it was not needed.
#
# Note the route is inert until the shell's Custom Domain exists, since it
# matches against the DNS record that binding creates — which is why the
# authority-first deploy order still leaves `/api/*` unreachable until the
# client deploys.
routes = [
  { pattern = "hb.twinion.net/api/*", zone_name = "twinion.net" },
]

#
# ADMIN_SECRET gates /api/admin/*: locally a dev var
# (`wrangler dev --var ADMIN_SECRET:...`, as smoke.sh does), in production
# a real secret (`wrangler secret put ADMIN_SECRET`). Unset, the admin
# lane fails closed with a 401.
#
# FCM_SERVICE_ACCOUNT is the notification lane's send credential (#219):
# the Google service-account JSON key, whole, as
# `wrangler secret put FCM_SERVICE_ACCOUNT`. Deliberately a secret and not
# a var — it carries an RSA private key, so it must never appear in this
# file, in `--var`, or in the repo. Unset (the state of every local
# `wrangler dev` and of CI), the send leg fails closed: the DO alarm still
# evaluates rules and still logs deliveries, and each one it cannot send is
# reported with `console_error!`. Nothing here is needed until a real
# device registers a push target.
#
# RUNNER_BASE_URL and RUNNER_BEARER_TOKEN are the skill-runner proxy's two
# secrets (#273, ADR-0018): the Fly app's origin (e.g.
# `https://hummingbird-runner.fly.dev`) and the bearer it authenticates
# `POST /run` with. Both `wrangler secret put`, set from the operator's
# terminal and never in GitHub Actions — the bearer reaches the runner's own
# `HB_API_TOKEN`, a write-everything device token, and spends metered model
# tokens, so it is transitively a write credential plus a spend faucet
# (CLAUDE.md, "Credential blast radius"). The base URL is a secret rather
# than a var deliberately, so the pair rotates together.
#
# Note the bearer now lives in **two** places: `fly secrets set` on the
# runner and `wrangler secret put` here. Rotating one without the other
# makes every tap answer 502 ("the cloud runner rejected this server's
# credential") until the second lands.
#
# Either one unset (the state of every local `wrangler dev` and of CI) fails
# the lane closed with a 503 naming the gap in prose — deliberately not a
# 401, which would make the client re-prompt a device token that is fine.
name = "hummingbird-authority"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-08"

[build]
command = "cargo install -q worker-build && worker-build --release"

[durable_objects]
bindings = [{ name = "AUTHORITY", class_name = "Authority" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Authority"]
