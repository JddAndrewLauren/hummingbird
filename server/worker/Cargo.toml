[package]
name = "hummingbird-authority-worker"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hummingbird-authority = { path = "../authority" }
hummingbird-domain = { path = "../domain" }
serde_json = "1.0"

# The shim only exists on wasm32 (the ffi-web pattern): the native
# `cargo test --workspace` run compiles this crate to a near-empty lib, and
# CI's `cargo build --target wasm32-unknown-unknown` is what gates the shim.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8.5"
# The authority's Entropy seam, implemented over crypto.getRandomValues.
# 0.2 pinned deliberately: 0.3 moved the wasm backend behind a RUSTFLAGS
# cfg, which would complicate every build entry point for no gain here.
getrandom = { version = "0.2", features = ["js"] }
# The FCM send leg (#219): `crypto.subtle` for the RS256 OAuth assertion.
# All three already resolve through `worker` itself, so this adds no new
# tree — only the three web-sys features the signing path names.
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "CryptoKey"] }
