[package]
name = "waste-cadence-prototype"
version = "0.0.0"
edition = "2021"
publish = false

# THROWAWAY. Deliberately NOT a member of the `server/` workspace: CI runs
# `cargo clippy --workspace` / `cargo test --workspace` from `server/`, and a
# prototype has no business being a gate on that. Its own empty `[workspace]`
# table makes this directory its own workspace root, which is what stops cargo
# from complaining that a package inside `server/` is not a listed member.
[workspace]

# One dependency, on purpose: the prototype answers a question about alert
# lifecycle, so it must use the REAL `is_live` predicate and the REAL
# `source_key` recipe rather than a hand-copied twin that could be subtly
# kinder than production.
[dependencies]
hummingbird-domain = { path = "../../domain" }
