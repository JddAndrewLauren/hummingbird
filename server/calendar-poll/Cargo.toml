[package]
name = "hummingbird-calendar-poll"
version.workspace = true
edition.workspace = true

# The out-of-process poller for `google-calendar/v1` (#136) — the second of
# #135-137's evaluated-stream pollers (ADR-0011), built directly onto #135's
# scaffolding. A workspace member, so CI's `cargo clippy --workspace` /
# `cargo test --workspace` gate it, on the exact split `server/gmail-poll`
# and `server/city-waste` already use: everything decidable lives in the lib
# and is natively tested against saved Calendar API response fixtures;
# `main.rs` holds only `std::env`, the OAuth token exchange and the HTTP
# calls — the untestable edge.
#
# It must NEVER become a dependency of `hummingbird-authority-worker`: that
# crate builds for wasm32 and has no business carrying an HTTP client.

[dependencies]
# The real `google_calendar_v1_key`, `Event`/`FieldValue`, and
# `now_as_deadline` — never a hand-copied twin.
hummingbird-domain = { path = "../domain" }
# Fire-time evaluation (ADR-0011: "the rule engine evaluates each poll batch
# in memory") — the exact crate #138's sweep and #140's backtest already
# share.
hummingbird-rules-engine = { path = "../rules-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# RFC3339 `dateTime`/`date` parsing (Google's own event `start`/`end`
# shapes) — the same crate `city-waste` already carries for the same
# reason (a tzdb, dependency-free arithmetic cannot supply one).
jiff = "0.2"

# `main.rs` only. Blocking by design: the poller is a one-shot process, so
# an async runtime would be pure ceremony (the same reasoning `city-waste`
# and `gmail-poll` already give).
[dependencies.ureq]
version = "3"
default-features = false
features = ["rustls", "json"]
