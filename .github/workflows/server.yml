# The authority server (ADR-0008): the **PR-time** test gate, and only that.
# The recipe itself lives in server-test.yml, shared with deploy-server.yml
# so the gate a PR sees and the gate the production deploy `needs:` cannot
# drift apart.
#
# There is deliberately no `push:` trigger. deploy-server.yml (ADR-0006's CI
# split) calls the same server-test.yml on `main` before it deploys, so a
# `push:` here would run that ~30-minute job a second time, concurrently,
# for no extra signal. `main` is therefore gated by deploy-server.yml's own
# test job — the same bytes this workflow runs on the PR.
name: server

on:
  pull_request:
    paths:
      - "server/**"
      - "rust-toolchain.toml"
      - ".github/workflows/server.yml"
      - ".github/workflows/server-test.yml"

# Superseded PR pushes cancel their stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/server-test.yml
