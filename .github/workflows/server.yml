# The authority server (ADR-0008): the PR-time and push-time test gate.
# The recipe itself lives in server-test.yml, shared with deploy-server.yml
# so the gate a PR sees and the gate the production deploy `needs:` cannot
# drift apart. No deploy here — deploy-server.yml (ADR-0006's CI split)
# calls the same tests on `main` and runs `wrangler deploy` behind them.
name: server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "rust-toolchain.toml"
      - ".github/workflows/server.yml"
      - ".github/workflows/server-test.yml"
  pull_request:
    paths:
      - "server/**"
      - "rust-toolchain.toml"
      - ".github/workflows/server.yml"
      - ".github/workflows/server-test.yml"

# Superseded PR pushes cancel their stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/server-test.yml
