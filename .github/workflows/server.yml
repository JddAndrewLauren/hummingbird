# The authority server (ADR-0008): native fixture tests for the pure
# crates, a wasm32 typecheck of the workers-rs shim, and the wire-level
# smoke test against `wrangler dev` (#113's CI acceptance). No deploy —
# S0 is local-dev + CI only.
name: server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "rust-toolchain.toml"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "rust-toolchain.toml"
      - ".github/workflows/server.yml"

# Superseded PR pushes cancel their stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The smoke script bounds its own readiness wait, but npx download and
    # `cargo install worker-build` on a cold cache are otherwise unbounded.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pinned to match root `rust-toolchain.toml` — see client.yml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          # worker-build is installed by wrangler.toml's [build] command;
          # caching ~/.cargo/bin keeps that install a no-op across runs.
          cache-bin: true

      - name: cargo clippy (server workspace)
        working-directory: server
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Native fixture tests (domain + authority)
        working-directory: server
        run: cargo test --workspace

      - name: wasm32 build of the workers-rs shim
        working-directory: server
        run: cargo build --target wasm32-unknown-unknown -p hummingbird-authority-worker

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke test against wrangler dev
        working-directory: server
        run: ./scripts/smoke.sh
