# Client CI: cargo test across the client/ workspace, a wasm32 build for the
# web FFI crate, and (#69) a test-gated build of client/web — pnpm
# install -> vitest -> tsc -> vite build, wasm core included. Deploy is out
# of scope here; deploy-client.yml (ADR-0006's split) gates its own build on
# main and runs `wrangler deploy` behind it.
name: client

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "rust-toolchain.toml"
      - ".github/workflows/client.yml"
      # The race pane's vitest reads the poller's own committed golden body
      # off disk (#119, `screens/race-pane/race.test.ts`), so a change to
      # that fixture alone is a change this suite has to see.
      - "server/race-poll/tests/fixtures/**"
      # ADR-0013's operator table and duration grammar, which
      # `hummingbird-core`'s rules decisions delegate to since #540 — a
      # change there changes what this suite's `screens/rules/*` tests
      # assert, through the wasm seam, with nothing else to notice.
      - "server/rules-engine/**"
  pull_request:
    paths:
      - "client/**"
      - "rust-toolchain.toml"
      - ".github/workflows/client.yml"
      - "server/race-poll/tests/fixtures/**"
      - "server/rules-engine/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history so a PR build exercises the real build-version
      # computation rather than only its shallow `+unknown` fallback.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to match root `rust-toolchain.toml` — `@stable` here would
      # install a different toolchain than every cargo invocation below
      # then resolves to, and the point of the pin is that a new stable's
      # new lints cannot turn an unrelated PR red.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      # Before the tests: a lint failure is cheap to read and the batch that
      # merged a live `too_many_arguments` warning with CI green is why this
      # step exists.
      - name: cargo clippy (client workspace)
        working-directory: client
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (client workspace)
        working-directory: client
        run: cargo test --workspace
      - name: build ffi-web for wasm32-unknown-unknown
        working-directory: client
        run: cargo build --target wasm32-unknown-unknown -p hummingbird-ffi-web
      # Pinned, not "latest": ADR-0004 requires lockfile-pinned client
      # builds, and a floating wasm-pack can change the shipped artifact (or
      # break CI) with no repository change. Bump deliberately.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"
      - name: wasm-pack build ffi-web (loadable package)
        working-directory: client/ffi-web
        run: wasm-pack build --target web --out-dir /tmp/ffi-web-pkg
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: client/web/pnpm-lock.yaml
      - name: pnpm install (client/web)
        working-directory: client/web
        run: pnpm install --frozen-lockfile
      - name: web unit tests
        working-directory: client/web
        run: pnpm test
      - name: web typecheck
        working-directory: client/web
        run: pnpm run typecheck
      # Errors fail the build; the known jsx-a11y violations in the ported
      # design-system components are warnings until HANDOFF-a11y-designsystem.md
      # is worked (then this can take --max-warnings 0).
      - name: web lint
        working-directory: client/web
        run: pnpm run lint
      - name: web build (wasm core in a worker + PWA shell)
        working-directory: client/web
        run: pnpm run build

      # A claim about the artifact, so only the artifact can answer it: the
      # demo fixtures are gated twice in source, but a dead branch only drops a
      # module Rollup can prove is side-effect-free at the top level. #420
      # shipped 5.3 KB of fixture past a gate that read as airtight. Must run
      # after the build, never instead of it.
      - name: no demo fixture in the production bundle
        working-directory: client/web
        run: pnpm run assert-no-fixtures
