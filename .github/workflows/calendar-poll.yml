# The Google Calendar evaluated-stream poller (#136, ADR-0011): advances a
# sync-token delta cursor, evaluates each changed event in memory against
# the live rule set, and upserts an alert for a match — never anything
# else. Non-matches never touch storage. Also writes the `busy_now` gauge
# (this issue's own second job), a separate always-run query around "now".
#
# **A third Actions `schedule:` on the same reasoning `gmail-poll.yml`'s
# header already recorded** — see that file for the full argument
# (hummingbird is public, so only the 60-day auto-disable survives from
# issue #8's ban, and this lane has no competing clock: ADR-0011 assigns
# Google Calendar's cadence to nothing else, and nothing else polls it).
#
# **Live since 2026-08-15 (#486).** The lane was dormant 2026-08-14→15: its
# first 78 runs all failed on `HB_INGEST_TOKEN is not set`, because neither
# `CALENDAR_INGEST_TOKEN` nor the three `GOOGLE_*` secrets had ever been
# minted, and the `schedule:` was commented out so that red stopped masking
# real failures. #486 provisioned the credentials, a `workflow_dispatch` run
# went green end-to-end (both cursor and `busy_now` snapshots verified), and
# the `schedule:` below is that same block restored — the one owner of this
# cadence, per gmail-poll.yml's argument.
# Note this lane's frozen source string is `google-calendar/v1`, not
# `calendar/v1`, which is what its ingest token must be bound to.
name: calendar-poll

on:
  # Every 15 minutes — `hummingbird_calendar_poll::cursor::POLLED_EVERY_MS`
  # must match this interval. Change one and you must change the other
  # (re-checked at the #486 restore: both are 15 minutes).
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# One poller at a time. Two overlapping runs would race on the same
# `syncToken` cursor row and the `busy_now` snapshot; the authority's
# snapshot lane already answers a stale write with the current row rather
# than corrupting it, but there is no reason to lean on that here either.
concurrency:
  group: calendar-poll

jobs:
  poll:
    runs-on: ubuntu-latest
    # An OAuth refresh, a couple of Calendar reads and a few authority
    # POSTs, behind a cached build. Anything slower than this is a hung
    # fetch.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned to match root `rust-toolchain.toml`, as every other workflow
      # here is.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Poll Google Calendar
        working-directory: server
        env:
          HB_BASE_URL: https://hb.twinion.net
          # An `ingest`-scope token bound to `google-calendar/v1`, minted
          # from the operator's terminal against `ADMIN_SECRET` — the
          # deploy-time step the brief calls out, not an implementation
          # step of this issue.
          HB_INGEST_TOKEN: ${{ secrets.CALENDAR_INGEST_TOKEN }}
          # THE SAME refresh token `gmail-poll.yml` and the sweeper use — one
          # broad Google credential for the whole repo, decided by the
          # operator on #486 (the decision that closed #135's open question).
          # ADR-0011's table always named "same OAuth app, scope re-mint" for
          # the calendar leg, and that re-mint is what happened: the one
          # credential now carries Tasks + `gmail.modify` +
          # `calendar.readonly`, minted by `scripts/mint_refresh_token.py`.
          # Without the third scope this lane could not run at all — the
          # sweeper's pre-#486 token had no calendar scope, so there was
          # never a "just reuse it" option that skipped a re-consent.
          #
          # Every Calendar call this poller makes (`events.list`) is a read
          # and stays inside `calendar.readonly` — nothing here ever writes to
          # the operator's calendar. The scope this lane does not need is the
          # Gmail one it inherits from sharing; `gmail-poll.yml`'s env block
          # carries the full argument for accepting that breadth.
          #
          # Rotating it is a THREE-place operation: 1Password, the Fly secret
          # on `hummingbird-sweeper`, and this Actions secret.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: cargo run -q -p hummingbird-calendar-poll
