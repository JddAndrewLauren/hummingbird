# Deploy only, mirroring deploy-client.yml's test-then-deploy shape for the
# authority server (ADR-0006's CI split). The test job is server-test.yml —
# the same recipe server.yml gates PRs with, called rather than copied, so a
# green PR check and a green deploy gate always mean the same thing.
#
# There is deliberately no `schedule:` trigger. The sweep's cadence belongs to
# the Durable Object's own `alarm()` at `ALARM_INTERVAL_MS` (#138/ADR-0014) —
# the same reasoning deploy.yml records for supercronic owning the sweeper's
# cadence: an Actions cron would be a second, competing clock.
#
# `ADMIN_SECRET` is deliberately absent below. It is set once from the
# operator's terminal (`wrangler secret put ADMIN_SECRET`) and read only by
# `/api/admin/*`; putting it in Actions would widen the one credential that
# mints every other token. `FCM_SERVICE_ACCOUNT` is absent for the same
# reason — it carries an RSA private key, and the notification lane fails
# closed without it by design.
#
# **Deploying for real since 2026-08-10** (#237). The `Authority` SQLite DO
# class was created by the `tag = "v1"` migration in
# server/worker/wrangler.toml on its first apply, done from the operator's
# terminal so the run could be watched. Worth knowing if a future migration
# ever needs the same scrutiny: **the deploy output says nothing about
# migrations**, and neither does `wrangler deployments list` or
# `versions view` — confirm against the API instead
# (`/workers/durable_objects/namespaces` carries `use_sqlite`, and
# `/workers/scripts` carries `migration_tag`).
name: deploy-server

# `workflow_dispatch` for the same reason as deploy-client.yml: a deploy that
# needs re-running when no file under `server/**` changed — after a rollback,
# or after a secret was set from the operator's terminal — otherwise has no
# trigger at all. `paths:` does not apply to a dispatch.
#
# The deploy job is guarded to `main` so `--ref <branch>` cannot ship an
# unmerged branch to the authority devices sync against; a dispatch from
# another ref still runs the full `server-test.yml` gate and stops there.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "rust-toolchain.toml"
      - ".github/workflows/deploy-server.yml"
      - ".github/workflows/server-test.yml"

jobs:
  # Same reasoning as deploy-client.yml: the deploy job's `if:` prevents a
  # non-main dispatch from shipping, but a skipped job shows green, and a
  # green deploy run is read as a deploy that happened. Fail loudly instead.
  refuse-non-main-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Refusing to deploy from $REF — this workflow deploys the authority devices sync against and runs only from main."
          exit 1

  test:
    uses: ./.github/workflows/server-test.yml

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-hummingbird-authority
    # wrangler.toml's [build] runs `cargo install -q worker-build &&
    # worker-build --release` inside the wrangler step, on a runner the test
    # job's Swatinem/rust-cache does not reach — a multi-minute cold Rust
    # build every time. Bounded here the way server-test.yml bounds its own.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pinned to match root `rust-toolchain.toml`: the deployed wasm artifact
      # should be built by the same compiler CI gated, not by whatever stable
      # happens to be on the day of the deploy.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      # The same cache server-test.yml keeps, for the same reason and with the
      # same settings: wrangler.toml's [build] runs `cargo install -q
      # worker-build && worker-build --release` inside the wrangler step
      # below, and the test job's cache lives on a different runner. Without
      # this every deploy pays a cold `cargo install` plus a full release
      # build of the shim.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          cache-bin: true
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/worker
          command: deploy
