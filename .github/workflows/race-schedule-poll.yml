# The race-schedule poller (#266): reads the whole F1 season from Jolpica
# four times a day and writes one `context_snapshots` row per adapted
# series. It raises no alert — that is race-alert-poll.yml's job, off the
# row this one writes.
#
# **A sixth Actions `schedule:`, and it does not reopen issue #8's ban.**
# city-waste.yml was the first and carries the full argument; gmail-poll.yml,
# calendar-poll.yml, graph-mail-poll.yml and graph-calendar-poll.yml
# followed on the same reasoning. #8's overturn had four clauses and three
# were about a *private* repo's Actions billing (pooled minutes, whole-minute
# rounding, the $0 cap); hummingbird is public, so only the 60-day
# auto-disable survives in general — and this lane is self-monitoring, since
# the pane bands its own answer stale at `2 × polled_every_ms` (12h) and then
# refuses to answer, so a stalled poller is loud within half a day. The ban
# still holds absolutely where it was really about *competing clocks*:
# supercronic owns the sweeper's cadence and the DO's `alarm()` owns the
# sweep tick, and a second cron for either would compete with a live one.
# Nothing else polls this feed.
#
# **Two crons for one lane is not a competing clock either** — see
# server/race-poll/src/lib.rs. This one owns "refresh the season" and
# race-alert-poll.yml owns "is a race starting"; they share no job, and the
# split is what keeps `polled_every_ms` at six hours so ADR-0015's
# `2 × cadence` rule works unchanged.
#
# **The credential** is `RACE_INGEST_TOKEN`, an `ingest`-scope token bound to
# `race-schedule/v1`, minted from the operator's terminal against
# `ADMIN_SECRET` (an operator gate — this lane is agent-built and
# operator-provisioned, the posture #256 took). It goes in Actions secrets on
# exactly `CITY_WASTE_INGEST_TOKEN`'s recorded blast-radius reasoning: it
# reaches three routes for one source, and its worst-case abuse is a wrong
# race time. **Jolpica itself needs no credential** — the `User-Agent`
# `race-schedule-poll` sends is a header, not a secret — so this is the first
# poller here whose upstream is unauthenticated.
name: race-schedule-poll

on:
  # Every six hours. `POLLED_EVERY_MS` in server/race-poll/src/body.rs must
  # match this interval — it is what `Freshness` reads as the declared
  # cadence, and what the pane's staleness band is computed from.
  schedule:
    - cron: "0 */6 * * *"
  # A missed or dropped run, and the first run after the token is minted,
  # otherwise have no trigger at all.
  workflow_dispatch:

# One poller at a time. Two overlapping runs would race on the same
# `(source, key)` row; the authority's own "an older `fetched_at` never
# overwrites" rule makes that safe rather than corrupting, but there is no
# reason to lean on it.
concurrency:
  group: race-schedule-poll

jobs:
  poll:
    runs-on: ubuntu-latest
    # A GET, a feed fetch and a POST per series, behind a cached build.
    # Anything slower than this is a hung fetch.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned to match root `rust-toolchain.toml`, as every other workflow
      # here is.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Poll the race schedule
        working-directory: server
        env:
          HB_BASE_URL: https://hb.twinion.net
          HB_INGEST_TOKEN: ${{ secrets.RACE_INGEST_TOKEN }}
        run: cargo run -q -p hummingbird-race-poll --bin race-schedule-poll
