# Deploy only, mirroring deploy.yml's test-then-deploy shape for the web
# client (ADR-0006's CI split). **Deploying for real since 2026-08-10**
# (#238): the first live run created the `hummingbird-web` project and bound
# `hb.twinion.net` as its Custom Domain, straight from the checked-in
# `routes` in client/web/wrangler.toml.
#
# `VITE_GOOGLE_CLIENT_ID` is set and the shipped bundle carries the calendar
# opt-in surface. Note the ordering that mattered: Vite substitutes `VITE_*`
# at BUILD time, so the secret has to exist before the deploy that is meant
# to carry it — set it after, and the live bundle keeps the (correct, but
# unwanted) never-opted-in state until something triggers another deploy.
name: deploy-client

# `workflow_dispatch` is here so a deploy can be re-run on demand without
# inventing a commit to trip the `paths:` filter with — redeploying the
# current `main` after a rollback, or after a change that lives entirely in
# Cloudflare (a Custom Domain binding, a secret) and touches no file here.
# `paths:` does not apply to a dispatch, which is exactly the point.
#
# The deploy job is guarded to `main` rather than the trigger being left
# open: `gh workflow run --ref <branch>` would otherwise ship an arbitrary
# branch to the production hostname, and this Worker serves a permanent
# origin (ADR-0006) that devices key their stored state to. A dispatch from
# another ref still runs the tests, and stops before deploying.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      # The build-version override: editing VERSION is the whole gesture
      # (see CLAUDE.md), so it has to trigger a deploy of its own rather
      # than sitting until the next client/** change.
      - "VERSION"
      - "rust-toolchain.toml"
      - ".github/workflows/deploy-client.yml"

jobs:
  # The deploy job's `if:` stops a non-main dispatch from shipping — but a
  # SKIPPED job renders as a green run, which reads as "deployed" to anyone
  # glancing at the checks. That is the failure mode worth spending a job
  # on: a guard that is silent when it holds teaches nobody it held. So say
  # so out loud, and fail, rather than letting the ref that was actually
  # deployed be something the reader has to infer.
  refuse-non-main-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Refusing to deploy from $REF — this workflow deploys the permanent production origin (ADR-0006) and runs only from main."
          exit 1

  test:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth-1: this is the job that builds
      # and uploads `dist/`, and the build version counts commits since
      # `VERSION` was last touched. A shallow clone refuses to guess (it
      # renders `+unknown`), so without this every deploy would ship one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to match root `rust-toolchain.toml`: the deployed wasm artifact
      # should be built by the same compiler CI gated, not by whatever stable
      # happens to be on the day of the deploy.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      # Pinned for the same reason as client.yml: ADR-0004's lockfile-pinned
      # build requirement covers the toolchain that produces the artifact
      # this workflow actually deploys.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: client/web/pnpm-lock.yaml
      - name: pnpm install (client/web)
        working-directory: client/web
        run: pnpm install --frozen-lockfile
      - name: web unit tests
        working-directory: client/web
        run: pnpm test
      - name: web typecheck
        working-directory: client/web
        run: pnpm run typecheck
      # Vite substitutes `VITE_*` at BUILD time, and App.tsx gates the whole
      # calendar opt-in surface on `VITE_GOOGLE_CLIENT_ID` — without this the
      # deployed bundle has no Connect button, picker, or tile at all
      # (issue #73). The secret holds the Web-application OAuth client id
      # registered against hb.twinion.net; see client/web/.env.example. It is
      # not a secret in the cryptographic sense (an OAuth client id ships in
      # the bundle either way) — it lives in Actions secrets only to keep the
      # deployment's client id out of the repository.
      - name: web build (wasm core + PWA shell)
        working-directory: client/web
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-web-dist
          path: client/web/dist
          retention-days: 1

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-hummingbird-web
    steps:
      - uses: actions/checkout@v4
      # wrangler-action installs wrangler with whatever package manager the
      # `workingDirectory` declares, and `client/web` declares pnpm — so this
      # job needs pnpm and Node on PATH even though it installs no
      # dependencies of its own and deploys a `dist/` it downloads rather
      # than builds. Without them the action fails before it ever reaches
      # Cloudflare, with `Unable to locate executable file: pnpm`.
      #
      # The deploy job had this hole from the start; nothing could surface it
      # until a deploy first got past the `needs: test` gate, which only
      # happened once the PWA precache ceiling was raised (#246).
      # `deploy-server.yml` does not need the same treatment: `server/worker`
      # has no `package.json`, so the action falls back to npm there.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: client-web-dist
          path: client/web/dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: client/web
          command: deploy
