# The Kimi balance poller (#313, ADR-0017 decision 5): reads Moonshot's own
# account-balance endpoint every six hours and writes the answer to the
# authority.
#
# **`schedule:` case, per the convention `city-waste.yml` established.**
# hummingbird is public, so scheduled Actions runs are free, and this lane
# is self-monitoring on the same posture: the pane bands its own answer
# stale at ~13h and then refuses to answer at all, so a stalled poller is
# visible within half a day without anyone watching this workflow. This is
# the sixth `schedule:` in the repo (after `city-waste.yml`,
# `gmail-poll.yml`, `calendar-poll.yml`, `graph-mail-poll.yml`,
# `graph-calendar-poll.yml`), and the same overturn of issue #8's ban
# applies verbatim — that ban was about a *private* repo's pooled Actions
# minutes and $0 spending cap, neither of which exists here. It does not
# compete with any live clock: this is the only thing that ever polls this
# endpoint.
#
# **Six hours, not daily.** A balance is a countdown to a hard cliff
# (`exceeded_current_quota_error` fails every hosted skill op closed once
# `available_balance <= 0`), so the poll interval has to be well inside the
# shortest plausible runway — the brief's own reasoning, echoed from
# `race-poll`'s 6h season refresh. Daily polling on a balance that can burn
# a third of itself in a day would produce a warning that arrives after the
# outage.
#
# `server/kimi-balance/src/body.rs::POLLED_EVERY_MS` must match this
# interval — it is what `Freshness` reads as the declared cadence, and
# `tests/contract.rs::polled_every_ms_is_six_hours` pins the constant's own
# side.
#
# **The credentials.** `KIMI_BALANCE_INGEST_TOKEN` is an `ingest`-scope
# token bound to `kimi-balance/v1`, minted from the operator's terminal
# against `ADMIN_SECRET` — on `city-waste`'s own blast-radius reasoning,
# this token reaches one route for one source and its worst-case abuse is a
# wrong reading on this very pane. `MOONSHOT_API_KEY` is the account key
# itself; CLAUDE.md's blast-radius test is satisfied because its worst-case
# abuse is bounded by the balance — which is visible on this pane the
# moment it is exhausted. Both go in Actions secrets, set from the
# operator's terminal (this workflow file only reads them).
#
# **`MOONSHOT_API_BASE_URL` is a repository *variable*, not a secret** — it
# names a host, not a credential — because `platform.kimi.ai` and
# `platform.kimi.com` keys are completely independent and the endpoint must
# match whichever platform the key was minted on (server/kimi-balance's own
# header). Hardcoding either host here would be a silent 401 the day the
# key is re-minted on the other one; setting it as a variable is the
# reviewable, environment-agnostic override CLAUDE.md's `VERSION` pattern
# already established for the same class of decision.
name: kimi-balance

on:
  schedule:
    - cron: "0 */6 * * *"
  # A missed or dropped run, and the first run after the tokens are minted,
  # otherwise have no trigger at all.
  workflow_dispatch:

# One poller at a time. Two overlapping runs would race on the same
# `(source, key)` row; the authority's own "an older `fetched_at` never
# overwrites" rule makes that safe rather than corrupting, but there is no
# reason to lean on it.
concurrency:
  group: kimi-balance-poll

jobs:
  poll:
    runs-on: ubuntu-latest
    # A GET and one POST, behind a cached build. Anything slower than this
    # is a hung fetch.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned to match root `rust-toolchain.toml`, as every other workflow
      # here is.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Poll the Kimi balance
        working-directory: server
        env:
          HB_BASE_URL: https://hb.twinion.net
          HB_INGEST_TOKEN: ${{ secrets.KIMI_BALANCE_INGEST_TOKEN }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MOONSHOT_API_BASE_URL: ${{ vars.MOONSHOT_API_BASE_URL }}
        run: cargo run -q -p hummingbird-kimi-balance
