# The skill-runner endpoint (#41, #256): its test gate, and only that.
# `runner/` arrived with no workflow matching `runner/**`, so its
# `node --test` suite ran nowhere; this closes that gap.
#
# There is deliberately no `schedule:` trigger. This is a push/PR gate with
# no clock of its own — see deploy.yml's header for the standing ban and
# city-waste.yml's for the one scoped exception; neither is in play here.
#
# There is also no deploy job. The runner ships by a hand-run `fly deploy`
# of runner/Dockerfile (the image *is* the skill version, #41 decision 5),
# so unlike client.yml/deploy-server.yml there is no deploy workflow running
# this same recipe on `main` — which is why, unlike server.yml, this one
# does carry a `push:` trigger for main, and why no reusable
# `workflow_call` split is warranted for a single shared-by-nobody step.
name: runner

on:
  push:
    branches: [main]
    # Duplicated verbatim under `pull_request:` below. GitHub Actions does
    # not expand YAML anchors, so the two lists genuinely have to be
    # written twice -- keep them identical.
    paths:
      - "runner/**"
      # The skills the image bakes in (runner/Dockerfile) are outside
      # `runner/`, and the runner's tests read the schema file directly --
      # a schema-only edit that breaks `--json-schema` must not ship
      # through a workflow that never ran.
      - ".claude/skills/parse-capture/**"
      - ".claude/skills/next-up-hb/**"
      - ".claude/skills/microtask/**"
      - ".claude/skills/grill-me/**"
      # The image also bakes in a *compiled* artifact (#116): the Rust
      # builder stage emits `client/next-up`'s `next-up-rank`. So a change
      # to `client/**` or `server/domain/**` can break this image while
      # `client.yml` stays green -- it builds wasm, not this binary, and
      # knows nothing about the builder stage's own constraints (no
      # OpenSSL, no C toolchain). `rust-toolchain.toml` is here because the
      # Dockerfile pins the same version and the two must move together.
      - "client/**"
      - "server/domain/**"
      - "server/Cargo.toml"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - ".github/workflows/runner.yml"
  # No `branches:` filter on purpose (server.yml does the same): a PR into a
  # batch integration branch must be gated exactly like a PR into main.
  pull_request:
    paths:
      - "runner/**"
      - ".claude/skills/parse-capture/**"
      - ".claude/skills/next-up-hb/**"
      - ".claude/skills/microtask/**"
      - ".claude/skills/grill-me/**"
      - "client/**"
      - "server/domain/**"
      - "server/Cargo.toml"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - ".github/workflows/runner.yml"

# Superseded PR pushes cancel their stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Plain `node --test` over fifteen files with no install step; anything
    # slower than this is a hung test, not a slow one.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Pinned to the major the image bakes in (runner/Dockerfile is
      # `FROM node:22-slim`, and runner/package.json declares
      # `engines.node >= 22`), so CI and the deployed image agree. Bump both
      # together, deliberately.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No install step and no cache key: `runner/` is dependency-free plain
      # ESM — every import is either a `node:` builtin or a relative path,
      # and there is no lockfile to install from. Adding a dependency means
      # adding an install step here.
      - name: node --test (runner)
        working-directory: runner
        run: node --test

      # `runner/scripts/` is operator-run bash that handles credentials, and
      # each shell tree in this repo is linted by whichever workflow already
      # watches its paths -- `skills.yml` gates `.claude/skills/*/scripts/*.sh`
      # and `deploy.yml` gates the root `scripts/`; neither watches here. The suite
      # above does spawn `switch-provider.sh` against a stubbed flyctl, so its
      # behaviour is covered; this catches the quoting and expansion classes a
      # behavioural test cannot see. `-S style` because these are short scripts
      # where the style checks are worth having and they pass clean today.
      # ubuntu-latest ships shellcheck; assert that rather than skip silently.
      - name: shellcheck (runner/scripts)
        run: |
          command -v shellcheck
          shellcheck -S style runner/scripts/*.sh

  # The gate the suite structurally cannot be. `runner/`'s tests inject a
  # fake `spawn`, which is the right call -- no test should need a real
  # `claude` binary -- but it means every fact about the *image* is
  # invisible to them. Four separate release blockers lived in that gap at
  # once (a builder stage that could not resolve `server/domain`'s
  # workspace root, a missing C toolchain, a final image with no
  # `libssl.so.3`, and an op that needed a shell it would never be granted)
  # and all four passed `test` green. This job is the counterweight, the
  # same role `runner/test/parse-capture.test.js` plays for the shipped
  # schema file.
  #
  # It builds and runs; it does not push. Deploy is still a hand-run
  # `fly deploy` (#41 decision 5, the image *is* the skill version).
  image:
    runs-on: ubuntu-latest
    # The Rust builder stage is the whole cost here and it is a cold,
    # cacheless release build of the ranker and its dependencies.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the runner image
        run: docker build -f runner/Dockerfile -t hummingbird-runner:ci .

      # The three Docker blockers were each invisible until something
      # actually executed the artifact, so this runs it. `next-up-rank`
      # reads its envelope from stdin and answers on stdout, which makes an
      # empty sweep the whole smoke test: a dynamic-link failure, a missing
      # binary and a bad COPY path all surface here as a non-zero exit.
      #
      # The sweep carries every `ChangesResponse` table because they are
      # `Deserialize` without `#[serde(default)]` -- an omitted one is a
      # parse error, not an empty table -- so this doubles as the wire
      # shape's own tripwire.
      - name: Smoke-run the baked ranker
        run: |
          echo '{"sweep":{"version":1,"projects":[],"routes":[],"fog":[],"items":[],"steps":[],"blocked_by":[],"alerts":[],"context_snapshots":[],"settings":[]},"now":{"local":"2026-08-11T09:53","epoch_ms":1786553580000}}' \
            | docker run --rm -i hummingbird-runner:ci /usr/local/bin/next-up-rank \
            | tee /dev/stderr \
            | grep -q '"candidates"'

      # The env var is the contract between the image and `main.js`; a
      # rename on either side leaves the runner spawning a binary that is
      # not there, and only an assertion against the built image can see it.
      - name: HB_NEXT_UP_BIN points at a binary that exists and is executable
        run: |
          docker run --rm hummingbird-runner:ci \
            sh -c 'test -x "$HB_NEXT_UP_BIN"'

      # The skills are baked in from outside `runner/`, and `run-skill.js`
      # spawns `claude` with `cwd` set to the repo root so its slash
      # commands resolve against `<cwd>/.claude/skills`. An unresolved
      # slash command fails *softly* -- passed through as prose, answered
      # plausibly against the schema -- so nothing at runtime would say so.
      - name: The shipped skills are where the repo root expects them
        run: |
          docker run --rm hummingbird-runner:ci \
            sh -c 'test -f /app/.claude/skills/parse-capture/SKILL.md \
                && test -f /app/.claude/skills/next-up-hb/SKILL.md \
                && test -f /app/.claude/skills/next-up-hb/schema.json \
                && test -f /app/.claude/skills/microtask/SKILL.md \
                && test -f /app/.claude/skills/microtask/schema.json \
                && test -f /app/.claude/skills/grill-me/SKILL.md \
                && test -f /app/.claude/skills/grill-me/schema.json'

      # `claude` is spawned by name from `main.js`; a base-image or npm
      # change that moved it off PATH would otherwise only show up in
      # production.
      - name: The Claude Code CLI is on PATH
        run: docker run --rm hummingbird-runner:ci sh -c 'command -v claude'
