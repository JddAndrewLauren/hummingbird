# The GitHub workflow-health poller (#314, ADR-0017 decision 2): every half
# hour it reads this repo's own `.github/workflows/*.yml` for every scheduled
# workflow, asks GitHub's own Actions API for each one's run history, and
# writes one `context_snapshots` row per workflow under
# `github-hummingbird/v1` — the tell for GitHub's 60-day auto-disable of an
# inactive repo's scheduled workflows, which stops every cron here at once
# with no visible gap at the services those workflows write to.
#
# **Moved off Actions `schedule:` at #774, onto the sweeper's supercronic
# clock** — `gmail-poll.yml`'s header carries the full argument (measured
# in #773): Actions `schedule:` delivered this at roughly once every four
# hours against the half-hourly interval below, and `hummingbird-sweeper`
# is an always-on container that can just run it on time instead.
# `workflow_dispatch` stays, for a manual run against a fresh checkout; the
# `crontab` entry now owns the standing cadence.
#
# **This poller watches every *other* scheduled workflow in the repo,
# itself no longer included** — #774 dropped its own `schedule:`, so
# `server/github-status/src/manifest.rs`'s `EVERY_SCHEDULED_WORKFLOW` no
# longer carries a row for `github-status.yml` (it never needed one to
# cover *itself*; that list is what this binary reads at build time, not a
# thing this file declares about its own trigger). It cannot detect its own
# death either way (see `server/github-status/src/lib.rs`'s header for why:
# a dead poller writes nothing, and nothing here can make it write
# something about itself) — that property is unchanged by where it runs.
#
# `server/github-status/src/body.rs::POLLED_EVERY_MS` must match the
# interval the poller actually runs at — now `crontab`'s entry for
# `github-status-poll`, not this file's own (removed) cron — and
# `server/github-status/tests/contract.rs::polled_every_ms_is_half_an_hour`
# pins the constant's own side.
#
# **Half-hourly, not the daily this shipped with.** A poller cannot resolve
# anything finer than its own interval, and this one's whole purpose is
# catching a dead cron *quickly* — against a daily poll, a `*/15` workflow
# that died five minutes after the snapshot went unreported for a day. The
# daily interval was argued from "no reason to poll more often than the
# workflows it watches run at their slowest"; the reader needed the
# *fastest*, since the pane judges each workflow against its own cadence,
# and reading it the other way is what left the pane a day behind the lane
# it exists to watch. The run is a GET and a POST behind a cached build on a
# public repo, so the cost of the change is nil.
#
# **The credential.** `GH_STATUS_INGEST_TOKEN` is an `ingest`-scope
# token bound to `github-hummingbird/v1`, minted from the operator's
# terminal against `ADMIN_SECRET` — on `city-waste`'s own blast-radius
# reasoning, this token reaches one route for one source and its worst-case
# abuse is a wrong reading on this very pane. **No other credential is
# needed here**: a run through this workflow (`workflow_dispatch`) reads
# this repo's own run history with the automatic, per-run `GITHUB_TOKEN`
# GitHub Actions already provides, scoped down to read-only via
# `permissions:` below. **The standing run on `hummingbird-sweeper` (#774)
# has no such automatic token** — no Actions context exists there — so it
# authenticates with `GH_STATUS_PAT`, a fine-grained PAT scoped to
# `contents: read` + `actions: read` on this repo only (the same read-only
# reach `permissions:` grants `GITHUB_TOKEN` here), set as a Fly secret and
# mapped onto this binary's `GITHUB_TOKEN` env var by `crontab`. The `GH_`
# prefix is not cosmetic: GitHub reserves `GITHUB_` for its own secrets and
# answers 422 to any attempt to create one, so the obvious
# `GITHUB_STATUS_INGEST_TOKEN` this shipped with was unprovisionable — and
# an unresolvable `secrets.*` expands to the empty string, so the lane
# failed as "not set" daily rather than as anything naming the real cause
# (#314).
name: github-status

on:
  # A missed or dropped run, and the first run after the token is minted,
  # otherwise have no trigger at all — `crontab`'s entry on
  # `hummingbird-sweeper` owns the standing cadence now (#774).
  workflow_dispatch:

# `GITHUB_TOKEN` needs nothing beyond reading this repo's own Actions run
# history; every other permission defaults to none.
permissions:
  contents: read
  actions: read

# One poller at a time. Two overlapping runs would race on the same
# `(source, key)` rows; the authority's own "an older `fetched_at` never
# overwrites" rule makes that safe rather than corrupting, but there is no
# reason to lean on it.
concurrency:
  group: github-status-poll

jobs:
  poll:
    runs-on: ubuntu-latest
    # A directory scan, N GETs against GitHub's API and N POSTs, behind a
    # cached build. Anything slower than this is a hung fetch.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned to match root `rust-toolchain.toml`, as every other workflow
      # here is.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Poll this repo's own scheduled workflows
        working-directory: server
        env:
          HB_BASE_URL: https://hb.twinion.net
          HB_INGEST_TOKEN: ${{ secrets.GH_STATUS_INGEST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: cargo run -q -p hummingbird-github-status
