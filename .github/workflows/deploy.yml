# Deploy only. There is deliberately no `schedule:` trigger here: scheduling
# the sweep on GitHub Actions was overturned in issue #8 (pooled minutes,
# whole-minute billing, the $0 spending cap, and 60-day auto-disable).
# supercronic inside the Fly container owns the cadence.
#
# Qualified 2026-08-10 (#120), which added the repo's one Actions `schedule:`
# in city-waste.yml: three of #8's four clauses were about a *private* repo's
# billing and hummingbird is public, so they no longer bite in general. They
# do not need to for the sweeper — **the reason the ban holds here is that
# supercronic is a live clock and a second one would compete with it**, which
# is a correctness argument rather than a billing one. Same for the
# authority's `alarm()` (see deploy-server.yml). The daily poller has no
# competing clock at all, which is what made it the exception.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "sweep.py"
      - "denylist.json"
      - "crontab"
      - "Dockerfile"
      - "fly.toml"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "sweep.py"
      - "denylist.json"
      - "crontab"
      - "Dockerfile"
      - "fly.toml"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/deploy.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests

      # `scripts/` is operator-run bash holding ADMIN_SECRET and an
      # unreissuable minted token, and no behavioural test reaches it — the
      # mint is a live authenticated call that cannot run in CI. shellcheck is
      # the only gate it gets, which makes the quoting and expansion classes it
      # catches worth more here than in a tested tree. `-S style` and
      # assert-don't-skip both match `runner.yml`'s step, which covers
      # `runner/scripts/` the same way for the same reason.
      #
      # This job runs on both push to `main` and `pull_request` (see the
      # triggers above), so a broken `sweep.py`/`tests/`/`scripts/*.sh` change
      # gets a red check on its PR rather than a red deploy after the merge
      # (#396). The `deploy` job below is guarded to push-only so the
      # `pull_request` run only ever reaches this test job.
      - name: shellcheck (scripts)
        run: |
          command -v shellcheck
          shellcheck -S style scripts/*.sh

  deploy:
    needs: test
    # `pull_request` now runs `test` above (#396), and this guard is what
    # stops that run from also shipping an unmerged branch to Fly.
    # deploy-client.yml and deploy-server.yml guard the same way on
    # `github.ref == 'refs/heads/main'` instead, because they also accept a
    # `workflow_dispatch` from any ref; this workflow has no dispatch trigger
    # and its `push` is already branch-locked to `main`, so `event_name` alone
    # is the narrower, sufficient check.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-hummingbird-sweeper
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
