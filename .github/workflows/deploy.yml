# Deploy only. There is deliberately no `schedule:` trigger here: scheduling
# the sweep on GitHub Actions was overturned in issue #8 (pooled minutes,
# whole-minute billing, the $0 spending cap, and 60-day auto-disable).
# supercronic inside the Fly container owns the cadence.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "sweep.py"
      - "denylist.json"
      - "crontab"
      - "Dockerfile"
      - "fly.toml"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/deploy.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-hummingbird-sweeper
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
