# The uptime poller (#315, ADR-0017 decisions 2/3/4/6): once an hour it
# issues one credential-free HTTP request per service declared in the
# committed `server/uptime-probe/services.json` (the authority, the web
# origin, the runner) and writes one `context_snapshots` row per service
# under `uptime/v1`.
#
# **Moved off Actions `schedule:` at #792, onto the sweeper's supercronic
# clock** — `gmail-poll.yml`'s header carries the full argument, measured
# in #773 and again after #774 landed: on 2026-09-08 this lane's newest
# snapshot sat 115 minutes old against its declared 60, while the five
# pollers #774 had just moved sat at 3–12 minutes against 15. Actions
# `schedule:` delivers roughly once every four hours, which is over the
# pane's 3h stale band, so the pane flipped `STALE` about a probe that
# ran and succeeded every time — and this is the pane that is supposed to
# notice every *other* service going dark. `hummingbird-sweeper` is an
# always-on container that can just run it on time, and this is the one
# poller that needs a single Fly secret to move (`UPTIME_PROBE_INGEST_TOKEN`
# — see below). The root `crontab`'s entry for `/app/bin/uptime-probe` owns
# the standing cadence now; `workflow_dispatch` stays as the manual
# fallback for as long as the Actions copy of the secret exists (#792's
# step 7 is the operator's call to delete it, on #774's precedent).
#
# One cost, accepted and written down (#792): the sweeper is the one
# service this probe cannot probe (ADR-0017 decision 4 — it never opens a
# listener), and it is now also the probe's host, so a dead sweeper
# silences the probe. The pane bands its own answer stale at 3h so that
# reads as "I can't tell", never as "fine", and the sweeper's own liveness
# stays healthchecks.io's job. `server/uptime-probe/src/lib.rs`'s "Where
# it runs" section has the whole of it.
#
# **Hourly, deliberately not faster** (ADR-0017 decision 6). Each probe
# cold-boots the scale-to-zero runner (`runner/fly.toml:21`,
# `min_machines_running = 0`); probing every fifteen minutes would cost it
# 96 avoidable wake-ups a day to learn nothing new when nothing has changed.
# This is the inversion decision 6 names outright — the most important
# service (the one that answers this poller's own probe) gets the least
# frequent probe. The whole workflow runs as one unit at this cadence; there
# is no per-service interval anywhere in `services.json`.
#
# `server/uptime-probe/src/body.rs::POLLED_EVERY_MS` must match the
# interval the probe actually runs at — now `crontab`'s entry for
# `uptime-probe`, not this file's own (removed) cron — it is what
# `Freshness` reads as the declared cadence, and
# `server/uptime-probe/tests/contract.rs::polled_every_ms_is_one_hour_and_the_crontab_says_so_too`
# pins the two together.
#
# **The credential.** `UPTIME_PROBE_INGEST_TOKEN` is an `ingest`-scope token
# bound to `uptime/v1`, minted from the operator's terminal against
# `ADMIN_SECRET` — on `city-waste`'s own blast-radius reasoning, this token
# reaches one route for one source and its worst-case abuse is a wrong
# reading on this very pane. **No other credential is needed at all**: this
# is the one poller in this whole design that holds no credential beyond its
# own ingest token — every request it makes against `authority`, `web` and
# `runner` is deliberately unauthenticated (ADR-0017 decision 3's "the right
# refusal is the signal").
name: uptime-probe

on:
  # The only trigger left: a manual run, while the Actions copy of the
  # secret still exists. The standing cadence is `crontab`'s.
  workflow_dispatch:

# One poller at a time. Two overlapping runs would race on the same
# `(source, key)` rows; the authority's own "an older `fetched_at` never
# overwrites" rule makes that safe rather than corrupting, but there is no
# reason to lean on it.
concurrency:
  group: uptime-probe

jobs:
  poll:
    runs-on: ubuntu-latest
    # Three unauthenticated requests and three POSTs, behind a cached
    # build. Anything slower than this is a hung fetch — including the
    # runner's own cold boot, which this probe deliberately triggers. The
    # bin's own 30s per-request `HTTP_TIMEOUT` is what actually bounds
    # that; this is the Actions-side belt over it, and `crontab` needs no
    # equivalent.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned to match root `rust-toolchain.toml`, as every other workflow
      # here is.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Probe the declared services
        working-directory: server
        env:
          HB_BASE_URL: https://hb.twinion.net
          HB_INGEST_TOKEN: ${{ secrets.UPTIME_PROBE_INGEST_TOKEN }}
        run: cargo run -q -p hummingbird-uptime-probe
