# The M365 mail evaluated-stream poller (#137, ADR-0011): advances a Graph
# `deltaLink` cursor over `mailFolders('inbox')/messages/delta`, evaluates
# each new message in memory against the live rule set, and upserts an
# alert for a match — never anything else. Non-matches never touch storage.
#
# A fourth Actions `schedule:`, on `gmail-poll.yml`/`calendar-poll.yml`'s own
# reasoning: this lane has no competing clock (ADR-0011 assigns this
# cadence to nothing else, and nothing else polls M365 mail).
#
# **Live since 2026-08-15 (#486 Phase B).** It was dormant from 2026-08-14:
# all 73 runs it had ever had failed on `HB_INGEST_TOKEN is not set`, because
# `M365_MAIL_INGEST_TOKEN`, the `GRAPH_*` vars and `GRAPH_CLIENT_PRIVATE_KEY`
# were never provisioned. All of them now are, and the lane has run green on
# both paths (first-run resync and cursor resume) before this `schedule:` was
# restored.
#
# **The blast-radius question this lane was gated on is settled.** An app-only
# Graph permission reads tenant-wide by default, which put
# `GRAPH_CLIENT_PRIVATE_KEY` on the `ADMIN_SECRET`/`FCM_SERVICE_ACCOUNT` side of
# CLAUDE.md's rule rather than the `CITY_WASTE_INGEST_TOKEN` side. An Exchange
# Application Access Policy now scopes this app registration to the one
# operator mailbox, verified by `Test-ApplicationAccessPolicy` returning
# Granted for it and Denied for another mailbox in the same tenant; the key
# went into Actions only after that. The record is on #486.
name: graph-mail-poll

on:
  # Every 15 minutes — `hummingbird_graph_poll::mail_cursor::POLLED_EVERY_MS`
  # must match this interval, and was re-checked against this cron when the
  # block was restored (#486 Phase B): both are 15 minutes.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# One poller at a time. Two overlapping runs would race on the same
# `deltaLink` cursor row.
concurrency:
  group: graph-mail-poll

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Poll M365 mail
        working-directory: server
        env:
          HB_BASE_URL: https://hb.twinion.net
          # An `ingest`-scope token bound to `m365-mail/v1`, minted from the
          # operator's terminal against `ADMIN_SECRET` — a deploy-time step,
          # not an implementation step of this issue.
          HB_INGEST_TOKEN: ${{ secrets.M365_MAIL_INGEST_TOKEN }}
          # The operator's own mailbox address — app-only Graph has no `/me`,
          # so this is required to name which mailbox to poll.
          GRAPH_MAILBOX_UPN: ${{ vars.GRAPH_MAILBOX_UPN }}
          GRAPH_TENANT_ID: ${{ vars.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ vars.GRAPH_CLIENT_ID }}
          # The registered certificate's SHA-1 thumbprint, base64url-encoded
          # — identifies a PUBLIC key and is not itself sensitive, so it is
          # an Actions *variable*, not a secret.
          GRAPH_CERT_THUMBPRINT_B64URL: ${{ vars.GRAPH_CERT_THUMBPRINT_B64URL }}
          # The certificate's PRIVATE key (ADR-0011: "certificate preferred
          # over a client secret, since secrets are portal-capped at 24
          # months"). Its blast radius is bounded on two axes, both now
          # decided (#486 Phase B): by *kind*, only `Mail.Read` and
          # `Calendars.Read`, both read-only — a narrowing the Google lanes
          # did NOT take, since #486 put those on one broad shared refresh
          # token instead — and by *reach*, an Exchange Application Access
          # Policy scoping the app registration to the single operator
          # mailbox. This workflow still cannot verify the policy is in
          # place; that verification is the operator's, recorded on #486,
          # and it is the precondition for this secret existing at all.
          GRAPH_CLIENT_PRIVATE_KEY: ${{ secrets.GRAPH_CLIENT_PRIVATE_KEY }}
        run: cargo run -q -p hummingbird-graph-poll --bin graph-mail-poll
