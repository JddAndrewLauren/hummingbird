# The Gmail evaluated-stream poller (#135, ADR-0011): advances a `historyId`
# delta cursor, evaluates each new message in memory against the live rule
# set, and upserts an alert for a match — never anything else. Non-matches
# never touch storage.
#
# **Moved off Actions `schedule:` at #774, onto the sweeper's supercronic
# clock.** This lane ran on Actions `schedule:` (every 15 minutes) from
# 2026-08-15 (#486) delivering at roughly once every four hours in practice
# — GitHub batches and delays `schedule:` runs under load, and does not
# guarantee the interval requested — measured and argued in #773.
# `hummingbird-sweeper` is already an always-on container with a live
# `*/15` supercronic clock and already holds the three `GOOGLE_*` secrets
# this poller reads, so #774 built this binary into that image and gave it
# a staggered entry in `crontab` instead: the true `*/15` this workflow's
# comment always claimed, finally delivered. `workflow_dispatch` stays, for
# a manual run against a fresh checkout.
name: gmail-poll

on:
  workflow_dispatch:

# One poller at a time. Two overlapping runs would race on the same
# `historyId` cursor row; the authority's snapshot lane already answers a
# stale write with the current row rather than corrupting it, but there is
# no reason to lean on that here either.
concurrency:
  group: gmail-poll

jobs:
  poll:
    runs-on: ubuntu-latest
    # An OAuth refresh, a handful of Gmail reads and a couple of authority
    # POSTs, behind a cached build. Anything slower than this is a hung
    # fetch.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned to match root `rust-toolchain.toml`, as every other workflow
      # here is.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Poll Gmail
        working-directory: server
        env:
          HB_BASE_URL: https://hb.twinion.net
          # An `ingest`-scope token bound to `gmail/v1`, minted from the
          # operator's terminal against `ADMIN_SECRET` — the deploy-time step
          # the brief calls out, not an implementation step of this issue.
          HB_INGEST_TOKEN: ${{ secrets.GMAIL_INGEST_TOKEN }}
          # ONE broad Google credential, shared with the sweeper and with
          # `calendar-poll` — the operator's decision on #486, which is what
          # settled #135's open question. It carries Tasks + `gmail.modify` +
          # `calendar.readonly`; `scripts/mint_refresh_token.py` is the one
          # place that mints it, and `docs/sweeper.md` is its runbook.
          #
          # This lane needs strictly less than it holds: every Gmail call it
          # makes (`history.list`, `messages.get`, `messages.list`,
          # `getProfile`) is a read, so `gmail.readonly` would cover it, and
          # ADR-0011's amendment preferred exactly that narrowing. The
          # decision went the other way on operator cost: a second dedicated
          # credential is a second consent to grant, a second secret in two
          # places, and a second thing to remember on every rotation, in a
          # single-operator system where both credentials would anyway sit in
          # the same 1Password vault behind the same account. The scope
          # breadth is real and is accepted, not overlooked — `gmail.modify`
          # here means a leak of this Actions secret can modify the mailbox,
          # not just read it. What bounds it is that the grant is revocable in
          # one gesture (revoke the OAuth grant, re-mint, set three places),
          # and that this is the operator's own Workspace account rather than
          # a tenant-wide reach.
          #
          # Rotating it is a THREE-place operation: 1Password, the Fly secret
          # on `hummingbird-sweeper`, and this Actions secret. Missing one
          # leaves that consumer failing on a revoked grant rather than on a
          # missing secret.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: cargo run -q -p hummingbird-gmail-poll
