<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Harness stub: a colored rectangle on a transparent canvas. No bird
       drawing belongs in this slice (#60); this file exists only to give
       the render/QC harness something to rasterize while it is built and
       tested. The transparent margin (no full-bleed background rect) lets
       the silhouette QC mode actually exercise alpha preservation instead
       of trivially passing on an opaque square. -->
