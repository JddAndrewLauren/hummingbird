# Checked-in source of truth for the web client's Cloudflare Workers static
# assets deploy (ADR-0006). Live deploy + the hb.twinion.net DNS binding are
# a human step (#69's brief); everything here is exercised locally with
# `wrangler dev` against a `pnpm build` output.

name = "hummingbird-web"
main = "csp-worker/worker.ts"
compatibility_date = "2026-08-08"

# The permanent origin (ADR-0006). This is not a deploy convenience: the
# device's IndexedDB mirror, the PWA install and the stored API key are all
# keyed to the origin, so a deploy that landed on a provider hostname would
# strand every device that had already onboarded there. It is declared here,
# in the checked-in source of truth, rather than left to whoever runs the
# deploy. `wrangler dev` ignores routes, so local builds are unaffected;
# `wrangler deploy` fails until the human step (Cloudflare project + DNS)
# binds the domain, which deploy-client.yml already documents as expected.
#
# This Custom Domain is hostname-exact and claims no path, which is what
# leaves room for the authority worker to take `hb.twinion.net/api/*` as a
# narrower route in front of it (ADR-0008's same-origin API; the mechanism
# and its flip condition are written out in `server/worker/wrangler.toml`).
# Cloudflare resolves the more specific pattern first, so an API request is
# answered by the authority and never reaches the asset worker below — which
# matters, because `not_found_handling` would otherwise turn a missing
# `/api/...` into a 200 `text/html` SPA shell rather than an error.
routes = [
  { pattern = "hb.twinion.net", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
