# Version catalog for the Android client. Everything here is
# lockstep-pinned (no ranges), same discipline as the repo's other
# lockfile-pinned client builds (ADR-0004's reasoning).
[versions]
agp = "8.11.1"
kotlin = "2.2.0"
composeBom = "2025.06.01"
activityCompose = "1.10.1"
lifecycle = "2.9.1"
coroutines = "1.10.2"
work = "2.10.2"
securityCrypto = "1.1.0-alpha06"
jna = "5.17.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
androidxTestRunner = "1.6.2"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
# CaptureViewModel (M1-5/#503): the "ViewModel over CoreHolder" pattern the
# brief names — `androidx.lifecycle.ViewModel` itself, nothing Compose- or
# LiveData-specific.
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
# `viewModel()` — how a composable reaches the Activity's `ViewModelStore`
# instead of holding its ViewModel in a `remember` that a fold/unfold throws
# away (see `CaptureViewModel.factory`'s doc for the defect that motivated
# this; the Pixel Fold is the only install target).
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
# The UniFFI-generated binding's one runtime dependency; `@aar` packaging
# is what ships the Android-native JNI dispatch library.
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
