[package]
name = "hummingbird-ffi-mobile"
version.workspace = true
edition.workspace = true
description = "UniFFI wrappers over hummingbird-core -> Kotlin (Android, Wear OS) and Swift (iPad)."

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
hummingbird-core = { path = "../core" }
# The owned-schema `Stage` enum `MobileTaskHost::capture` (M1-5/#503) takes —
# the same cross-workspace dependency `hummingbird-core` itself already
# carries, needed here only to *name* the type (`ffi-web`'s Cargo.toml
# carries the identical dependency for the identical reason).
hummingbird-domain = { path = "../../server/domain" }
# ADR-0013's `Operator`, needed here only to *name* the type this crate's
# rules records mirror as a `uniffi::Enum` (#540/M4) — same
# already-carried-by-`hummingbird-core` reasoning as the line above.
hummingbird-rules-engine = { path = "../../server/rules-engine" }
# `tokio` on uniffi because the exported async surface runs under
# `async_runtime = "tokio"` — `Core::run`'s reqwest transports need a tokio
# reactor, and the generated Kotlin suspend functions poll futures on the
# runtime uniffi manages, not on any host thread.
uniffi = { version = "0.28", features = ["tokio"] }
# `time` for `MobileDiagnosticClock::sleep_ms` (#769) — the observed sync
# cycle's slow/stalled watchdog needs a real async sleep, and this host
# (unlike `ffi-web`'s bare `wasm32`) already runs on this very tokio
# reactor, so `tokio::time::sleep` is the natural seam rather than a second
# timer dependency.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# `hummingbird_core::diagnostics::DiagnosticClock` (#769) is declared
# `#[async_trait]`-shaped in `hummingbird-core`; implementing it here
# (`MobileDiagnosticClock`, `lib.rs`) needs the identical macro, same
# version `hummingbird-core`'s own `Cargo.toml` pins, so the two crates'
# desugared signatures agree.
async-trait = "0.1.92"
# For the one `reqwest::Client` the host constructs and hands to both
# transports. `default-features = false` + `rustls-tls` deliberately
# mirrors `../core`'s declaration — cargo unifies features per crate, so a
# default-featured `reqwest` here would silently re-add the `native-tls`/
# `openssl-sys` stack that has no Android NDK build (see core's Cargo.toml).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# OS randomness for `mint_mutation_seed` (see its doc): a mobile mutation
# seed becomes an entity id the authority creates idempotently, so it has to
# be unique across process restarts, not just within one process. Already in
# this workspace's tree transitively; named directly here because this crate
# depends on it for a decision, not incidentally.
getrandom = "0.2"
# Serializing the one wire body this crate builds itself: M2's
# `CreatePushTarget` (`MobileTaskHost::register_push_target`). Every other
# mutation here is built inside `hummingbird-core`; push targets are not a
# mirror entity, so their POST is assembled at this seam instead.
serde_json = "1"

[features]
# The Kotlin/Swift binding generator, behind a feature so the `cdylib`
# `cargo ndk` cross-compiles never carry the CLI's dependency tree
# (clap et al.) into the .so. `client/android`'s build script enables it
# only for the host-side `uniffi-bindgen` run.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt", "macros"] }
