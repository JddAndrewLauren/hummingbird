[package]
name = "hummingbird-next-up"
version.workspace = true
edition.workspace = true
description = "The /next-up-hb skill's seam (#116): a sweep payload in, ranked candidates out."

[[bin]]
name = "next-up-rank"
path = "src/main.rs"

[dependencies]
# `rank()` itself (#162) — this crate is its caller, never a second copy of
# the six steps.
#
# `default-features = false` drops `reqwest-transport`, and with it the
# whole TLS stack: `rank()` is pure, this crate makes no request, and the
# runner image it is baked into (`node:22-slim`) carries neither
# `libssl.so.3` nor a C toolchain to build `openssl-sys` against. Keeping
# the default on would have made the ranker unbuildable in the builder
# stage and unrunnable in the final one — both, and separately.
hummingbird-core = { path = "../core", default-features = false }
# The owned-schema wire DTOs (ADR-0009): the sweep payload is deserialized
# into the same types both sides already compile.
hummingbird-domain = { path = "../../server/domain" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
