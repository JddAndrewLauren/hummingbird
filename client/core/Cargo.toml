[package]
name = "hummingbird-core"
version.workspace = true
edition.workspace = true
description = "Binding-agnostic sync engine core (ADR-0003)."

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
# The owned-schema wire DTOs and domain records (ADR-0008/0009), compiled by
# both sides — this crate deserialises them, never redefines them (#100/#101).
hummingbird-domain = { path = "../../server/domain" }
# ADR-0013's operator vocabulary and its type-gating table, so
# `decisions::rules` gates an editor's operator dropdown against the exact
# function the authority evaluates with (`Operator::is_legal_for`) rather
# than a per-client copy of the same table — #540/M4's whole point.
# Safe to add here despite this crate's two constrained builds: the crate
# depends on `hummingbird-domain` + `serde_json` and nothing else, so it
# carries no HTTP client, no tzdb and no C toolchain into either the
# `wasm32-unknown-unknown` build (`ffi-web`) or `client/next-up`'s
# `default-features = false` one.
hummingbird-rules-engine = { path = "../../server/rules-engine" }
# NO `chrono-tz`, deliberately, and it is not an omission to be repaired.
# It was here for exactly one job — resolving a Google all-day boundary
# (`date`, no time) to the instant of local midnight in the calendar's own
# zone — and ADR-0015's 2026-08-10 amendment deleted that job: an all-day
# event now carries the provider's civil dates verbatim
# (`calendar::EventWhen::AllDay`), because flattening a day to an instant
# and reading it back one zone east lands a calendar day out. This crate
# resolves no civil date to an instant anywhere; the reader does, in its
# own zone. Adding a zone table back would re-open that door, and it is not
# free either: the table took the release wasm from 525 KB to 1.41 MB
# (brotli 175 KB -> 247 KB over the wire), and dropping it takes that back.
# The live HTTP transports, and the ONLY thing in this crate that reaches
# outside the process. Optional (see `[features]` below) because
# `client/next-up` compiles this crate for `rank()` alone — a pure function
# — and no TLS stack at all is still the right build for it.
# `rustls-tls` rather than the default `native-tls`, since the Android
# client (#141): `native-tls` means `openssl-sys`, which has no NDK build —
# the cross-compile to `aarch64-linux-android` fails unless OpenSSL is
# vendored and compiled from source per ABI. rustls is pure Rust, compiles
# on every native target this crate serves (macOS/Linux tests, Android via
# `ffi-mobile`), and on `wasm32` the TLS feature is moot either way (the
# browser's own fetch stack carries TLS). This also removes the
# `pkg-config` + `libssl-dev` build dependency and the `libssl.so.3`
# *runtime* dependency that the runner image (`node:22-slim`) could not
# satisfy — the original reason this dependency went behind a feature.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The diagnostics module's (#706) operation.slow/operation.stalled watchdog
# races an awaited operation against a caller-injected timer using
# `futures_util::future::select` — pure computation, no runtime/reactor of
# its own, so it costs nothing on the `wasm32-unknown-unknown` build the way
# a `tokio` dependency would (this crate has none in production code; see
# `sync/mod.rs`'s seed-minting rule for why no runtime lives here at all).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The write adapter's deterministic id derivation (#101) ports sweep.py's
# `deterministic_v4` (sha256-then-force-v4-nibbles) — same primitive the
# authority already uses for token hashing (server/authority/Cargo.toml).
sha2 = "0.10"

# The one seam that is a Cargo feature rather than a trait. Every transport
# in this crate is already behind a trait (`ChangesTransport`,
# `MutationTransport`, `EventsTransport`, `CalendarListTransport`); this
# feature gates only the `reqwest`-backed *implementations* of them, so a
# consumer that injects its own transport — or, like `client/next-up`,
# calls `rank()` and makes no request at all — compiles the crate with no
# TLS stack, no `openssl-sys` and no C toolchain.
#
# **On by default**, so `ffi-web`, `ffi-mobile` and every existing caller
# are unchanged and cannot silently lose their transports; the ranker opts
# out explicitly with `default-features = false`.
[features]
default = ["reqwest-transport"]
reqwest-transport = ["dep:reqwest"]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
indexed_db_futures = "0.6.4"
