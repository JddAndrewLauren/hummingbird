[package]
name = "hummingbird-ffi-web"
version.workspace = true
edition.workspace = true
description = "wasm-bindgen wrappers over hummingbird-core -> TypeScript."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hummingbird-core = { path = "../core" }
# The owned-schema `Item`/`Stage` DTOs `Core::frontier`/`Core::capture`
# already speak (#105/S7's task binding) — the same cross-workspace
# dependency `hummingbird-core` itself already carries, needed here only to
# *name* the types this crate's task binding constructs/returns (`Stage` in
# particular, to parse the wire's stage string into the enum `Core::capture`
# takes).
hummingbird-domain = { path = "../../server/domain" }
# Needed only to *name* ADR-0013's `Operator` at this boundary (#540/M4):
# the rules bindings take and return the wire operator strings, and parse
# them through the one enum the authority evaluates with rather than
# matching on strings here. Same already-carried-by-`hummingbird-core`
# dependency as `hummingbird-domain` above.
hummingbird-rules-engine = { path = "../../server/rules-engine" }
# `hummingbird_core::diagnostics::DiagnosticClock` (#769) is declared
# `#[async_trait]`-shaped in `hummingbird-core`; implementing it here
# (`TaskHostClock`, `task_host.rs`) needs the identical macro, same version
# `hummingbird-core`'s own `Cargo.toml` pins, so the two crates' desugared
# signatures agree.
async-trait = "0.1.92"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# `TaskHostClock`'s native `sleep_ms` (#769) — the observed sync cycle's
# slow/stalled watchdog needs a real async sleep on the native target this
# crate's own `cargo test` suite runs on (`now_monotonic_ms`'s doc has the
# identical per-target split). Declared only for `cfg(not(wasm32))`, so it
# never reaches the `wasm32-unknown-unknown` artifact `wasm-pack` actually
# ships — `sleep_ms`'s `wasm32` half sleeps through JS `setTimeout` instead
# (`task_host.rs`'s `sleep_ms_wasm`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
