[package]
name = "hummingbird-ffi-web"
version.workspace = true
edition.workspace = true
description = "wasm-bindgen wrappers over hummingbird-core -> TypeScript."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hummingbird-core = { path = "../core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
